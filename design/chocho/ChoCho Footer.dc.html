<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Caveat:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
  .chocho-ft a:focus-visible { outline: 2px solid #ffc93c; outline-offset: 2px; }
</style>
<script src="chocho-site.js"></script>
</helmet>
<footer class="chocho-ft" ref="{{ ftRef }}" style="margin: 0 clamp(16px, 2.4vw, 22px) {{ ftMb }}; padding: {{ ftPad }}; border-top: 1px solid rgba(167,139,250,.14); font-family: Manrope, sans-serif; display: flex; align-items: center; flex-wrap: wrap; gap: {{ ftGap }};">
  <span style="width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid rgba(167,139,250,.28); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #cbb6e6;">18+</span>
  <span style="display: flex; flex-direction: column; gap: 3px;">
    <span style="font-size: 13.5px; font-weight: 700; color: #e6ddf5;">Play Responsibly</span>
    <span style="font-size: 12px; font-weight: 500; color: #8f7aae;">Gaming should be fun.</span>
  </span>
  <img src="assets/pagcor-licensed.png" alt="Licensed by PAGCOR" style="height: 34px; width: auto; flex: none; object-fit: contain; display: block; margin-left: {{ pagMl }};">
  <span style="flex: 1; min-width: 8px; display: {{ spacer }};"></span>
  <div style="flex: {{ rowFlex }}; display: {{ linkDisplay }}; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: center; flex-wrap: wrap; gap: {{ linkGap }};">
    <sc-for list="{{ links }}" as="f" hint-placeholder-count="5">
      <a href="{{ f.href }}" onClick="{{ f.onClick }}" aria-current="{{ f.current }}" style="min-height: {{ linkH }}; display: flex; align-items: center; font-size: 13px; font-weight: {{ f.weight }}; color: {{ f.color }}; text-decoration: {{ f.deco }}; text-underline-offset: 5px; text-decoration-color: rgba(255,201,60,.55);" style-hover="color: #fff">{{ f.label }}</a>
    </sc-for>
  </div>
  <span style="flex: {{ rowFlex }}; display: flex; align-items: center; gap: 8px; margin-left: {{ tagMl }}; font-family: Caveat, cursive; font-size: 19px; font-weight: 700; line-height: 1.15; color: #f4b83d; text-align: {{ tagAlign }};">A Brighter Play<br>for a Better Tomorrow <span style="font-size: 14px; color: #ff5d7d;">♥</span></span>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1024,&quot;height&quot;:120}}">
class Component extends DCLogic {
  state = { phone: typeof window !== "undefined" && window.innerWidth < 600, compact: typeof window !== "undefined" && window.innerWidth < 900, mb: 0 };
  _ft = React.createRef();
  // Phones and tablets: the page ends a fixed distance below the footer — enough for the bottom
  // navigation plus the support mascot above it, no more. Pages pad their ends
  // differently, so the footer measures what follows it and makes up the difference.
  fitEnd() {
    const el = this._ft.current;
    if (!el || window.innerWidth >= 900) return;
    const nav = document.querySelector(".chocho-bn");
    const navH = nav ? Math.max(0, window.innerHeight - nav.getBoundingClientRect().top) : 0;
    const want = navH ? navH + 10 + 70 + 14 : 24;
    const cur = parseFloat(el.style.marginBottom) || 0;
    const trail = document.documentElement.scrollHeight - (el.getBoundingClientRect().bottom + window.scrollY) - cur;
    const mb = Math.round(want - trail);
    if (Math.abs(mb - this.state.mb) > 1) this.setState({ mb: mb });
  }
  componentDidMount() {
    this._r = () => {
      const p = window.innerWidth < 600;
      const c = window.innerWidth < 900;
      if (p !== this.state.phone || c !== this.state.compact) this.setState({ phone: p, compact: c, mb: 0 });
      requestAnimationFrame(() => this.fitEnd());
    };
    window.addEventListener("resize", this._r);
    [300, 1200, 2500].forEach(t => setTimeout(() => this.fitEnd(), t));
  }
  componentWillUnmount() { window.removeEventListener("resize", this._r); }
  renderVals() {
    const p = this.state.phone;
    return {
      ftGap: p ? "14px 14px" : "18px",
      ftPad: p ? "24px 0 4px" : "28px 0 4px",
      ftMb: this.state.compact ? this.state.mb + "px" : "0px",
      ftRef: this._ft,
      pagMl: p ? "0" : "14px",
      spacer: p ? "none" : "block",
      rowFlex: p ? "1 1 100%" : "0 1 auto",
      linkGap: p ? "0 16px" : "14px",
      linkDisplay: p ? "grid" : "flex",
      linkH: p ? "44px" : "0",
      tagMl: p ? "0" : "auto",
      tagAlign: p ? "left" : "right",
      // Information pages are ordinary links (Back/Forward, refresh, new tab all work).
      links: [
        { label: "Responsible Gaming", key: "responsible-gaming" },
        { label: "FAQ", key: "faq" },
        { label: "Support", support: true },
        { label: "Terms", key: "terms" },
        { label: "Privacy", key: "privacy" }
      ].map(l => {
        const onInfo = /ChoCho(%20| )Info\.dc\.html$/.test(window.location.pathname);
        const cur = onInfo ? ((window.location.search.match(/[?&]page=([\w-]+)/) || [])[1] || this.props.infoPage || null) : null;
        const on = !!(l.key && cur === l.key);
        return {
          label: l.label,
          href: l.support ? "#" : "ChoCho Info.dc.html?page=" + l.key,
          current: on ? "page" : null,
          color: on ? "#ffffff" : "#a795c5",
          weight: on ? 700 : 500,
          deco: on ? "underline" : "none",
          onClick: l.support
            ? (e => { e.preventDefault(); window.dispatchEvent(new CustomEvent("chocho:support")); })
            : undefined
        };
      })
    };
  }
}
</script>
</body>
</html>
